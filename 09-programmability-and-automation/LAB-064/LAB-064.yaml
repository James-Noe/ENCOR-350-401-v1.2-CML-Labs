nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname AUTO-ACC1
          no ip domain lookup
          ip domain name auto.example
          service timestamps debug datetime msec
          service timestamps log datetime msec
          logging buffered 64000
          enable secret Cisco123!
          username admin privilege 15 secret Cisco123!
          vtp mode transparent
          vlan 10
           name USERS
          vlan 20
           name OPS
          vlan 999
           name NATIVE
          ip routing
          spanning-tree mode rapid-pvst
          interface Ethernet0/0
           description MGMT1 ens2
           switchport trunk encapsulation dot1q
           switchport trunk native vlan 999
           switchport mode trunk
           switchport nonegotiate
          interface Ethernet0/1
           description PC3 eth0
           switchport access vlan 10
           switchport mode access
           spanning-tree portfast
          interface Vlan10
           ip address 10.90.10.1 255.255.255.0
           no shutdown
          interface Vlan20
           ip address 10.90.20.1 255.255.255.0
           no shutdown
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: AUTO-ACC1
    node_definition: ioll2-xe
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 0
    y: -80
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: Ethernet0/0
        mac_address: null
        type: physical
        slot: 0
      - id: i2
        label: Ethernet0/1
        mac_address: null
        type: physical
        slot: 1
      - id: i3
        label: Ethernet0/2
        mac_address: null
