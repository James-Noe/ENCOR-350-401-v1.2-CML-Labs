          hostname: AUTO-MGMT1
          manage_etc_hosts: True
          system_info:
            default_user:
              name: cisco
          password: cisco
          chpasswd: { expire: False }
          ssh_pwauth: True
      - name: network-config
        content: |-
          #network-config
          network:
            version: 2
            ethernets:
              ens2:
                dhcp4: false
                dhcp6: false
                link-local: []
                optional: true
              ens3:
                dhcp4: false
                dhcp6: false
                link-local: []
                optional: true
              ens4:
                dhcp4: false
                dhcp6: false
                link-local: []
                optional: true
