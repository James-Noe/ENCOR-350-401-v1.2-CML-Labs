annotations:
  - border_color: '#00000000'
    border_style: ''
    color: '#333333'
    rotation: 0
    text_bold: false
    text_content: Catalyst Center stand-in on localhost (https://127.0.0.1:9443)
    text_font: ''
    text_italic: false
    text_size: 12
    text_unit: pt
    thickness: 1
    type: text
    x1: -150.0
    y1: -60.0
    z_index: 0
smart_annotations: []
nodes:
  - boot_disk_size: null
    configuration:
      - name: user-data
        content: |-
          #cloud-config
          hostname: AUTO-MGMT1
          manage_etc_hosts: true
          ssh_pwauth: true
          users:
          - name: cisco
            shell: /bin/bash
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            plain_text_passwd: cisco
          write_files:
          - path: /home/cisco/catc/catc_mock.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/catc/gen_cert.sh
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/catc/ai/assistant-transcript.md
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/catc/fixtures/command-output.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/catc/fixtures/issues.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/catc/fixtures/network-device.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/catc/fixtures/site-health.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /etc/systemd/system/catc-mock.service
            permissions: '0644'
            encoding: b64
            content: 
          runcmd:
          - [sh, -c, 'mkdir -p /home/cisco/catc/logs /home/cisco/catc/certs /home/cisco/catc/work; chown -R cisco:cisco /home/cisco']
          - [sh, -c, 'systemctl daemon-reload; systemctl enable --now catc-mock.service']
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: AUTO-MGMT1
    node_definition: ubuntu
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: 0
    y: 0
    interfaces:
      - id: i0
        label: ens2
        mac_address: null
        type: physical
        slot: 0
links: []
lab:
  description: Evaluate a Catalyst Center API sandbox served by a local stand-in,
    and its AI workflows. See LAB.md
  notes: ''
  title: ENCOR LAB-076 Catalyst Center and AI Workflows
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
