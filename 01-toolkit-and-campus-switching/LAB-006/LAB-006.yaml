          interface Vlan10
           ip address 10.0.10.1 255.255.255.0
           no shutdown
          interface Vlan20
           ip address 10.0.20.1 255.255.255.0
           no shutdown
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh telnet
          end
