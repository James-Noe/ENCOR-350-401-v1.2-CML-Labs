  - boot_disk_size: null
    configuration:
      - name: radiusd.conf
        content: |-
          log {
              destination = stdout
              auth = yes
              auth_badpass = yes
              auth_goodpass = no
          }
          security {
              require_message_authenticator = no
              limit_proxy_state = false
          }
          client lab {
              ipaddr = 10.0.0.0/8
              secret = RADKEY123
              require_message_authenticator = no
              nas_type = cisco
          }
          modules {
              files {
                  filename = /etc/freeradius/3.0/mods-config/files/authorize
              }
              pap {
              }
              linelog acctlog {
                  filename = /dev/stdout
                  format = "ACCT %{Acct-Status-Type} user=%{User-Name} nas=%{NAS-IP-Address} session=%{Acct-Session-Id}"
              }
          }
          server default {
              listen {
                  type = auth
                  ipaddr = *
                  port = 1812
              }
              listen {
                  type = acct
                  ipaddr = *
                  port = 1813
              }
              authorize {
                  files
                  pap
              }
              authenticate {
                  pap
              }
              accounting {
                  acctlog
              }
          }
      - name: users
        content: |-
          netadmin Cleartext-Password := "netpass"
                  Service-Type = NAS-Prompt-User,
                  Cisco-AVPair = "shell:priv-lvl=15"
          netops Cleartext-Password := "opspass"
                  Service-Type = NAS-Prompt-User,
                  Cisco-AVPair = "shell:priv-lvl=1"
      - name: boot.sh
        content: |-
          ip address add 10.50.50.52/24 dev eth0
          ip link set dev eth0 up
          ip route add default via 10.50.50.1
          echo "READY" >/dev/console
          exit 0
    cpu_limit: null
    cpus: null
    data_volume: null
