          router ospf 1
           router-id 10.255.0.1
           passive-interface Ethernet0/1
           passive-interface Ethernet0/2
           passive-interface Loopback0
          ipv6 router ospf 1
           router-id 10.255.0.1
           passive-interface Ethernet0/1
           passive-interface Ethernet0/2
           passive-interface Loopback0
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh
          end
