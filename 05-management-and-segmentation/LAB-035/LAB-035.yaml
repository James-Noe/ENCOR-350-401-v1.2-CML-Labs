    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          ip domain name veridian.example
          service timestamps debug datetime msec
          service timestamps log datetime msec
          logging buffered 64000
          enable secret Cisco123!
          username admin privilege 15 secret Cisco123!
          crypto key generate rsa modulus 2048
          ip ssh version 2
          ip ssh server algorithm encryption aes128-cbc aes256-ctr
          ip ssh server algorithm mac hmac-sha1 hmac-sha2-256
          ip ssh server algorithm kex diffie-hellman-group14-sha1 diffie-hellman-group14-sha256 ecdh-sha2-nistp256
          ip ssh server algorithm hostkey ssh-rsa rsa-sha2-256
          interface Loopback0
           ip address 10.255.0.1 255.255.255.255
          interface Ethernet0/0
           ip address 10.0.1.1 255.255.255.254
           no shutdown
          interface Ethernet0/1
           ip address 10.0.10.1 255.255.255.0
           no shutdown
          interface Ethernet0/2
           no ip address
          interface Ethernet0/3
           no ip address
          ip route 0.0.0.0 0.0.0.0 10.0.1.0
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh
          end
