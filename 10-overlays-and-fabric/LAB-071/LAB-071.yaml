nodes:
  - boot_disk_size: null
    configuration:
      - name: hosts
        content: '10.50.51.53 dns1.veridian.example dns1

          '
      - name: dnsmasq.conf
        content: |-
          no-resolv
          addn-hosts=/etc/banner_add_hosts
          domain=veridian.example
          local=/veridian.example/
          expand-hosts
          log-queries
          log-facility=-
          address=/erp.veridian.example/10.50.51.53
      - name: boot.sh
        content: |-
          ip address add 10.50.51.53/24 dev eth0
          ip link set dev eth0 up
          ip route add default via 10.50.51.1
          echo "READY" >/dev/console
          exit 0
