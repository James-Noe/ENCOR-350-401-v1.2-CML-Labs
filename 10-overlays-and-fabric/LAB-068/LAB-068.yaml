nodes:
  - boot_disk_size: null
    configuration:
      - name: user-data
        content: |-
          #cloud-config
          hostname: AUTO-MGMT1
          manage_etc_hosts: true
          ssh_pwauth: true
          users:
          - name: cisco
            shell: /bin/bash
            sudo: ALL=(ALL) NOPASSWD:ALL
            lock_passwd: false
            plain_text_passwd: cisco
          write_files:
          - path: /var/tmp/lab059.tgz
            encoding: b64
            permissions: '0644'
            content: 
          - path: /home/cisco/trust/fetch-rtr3-cert.sh
            permissions: '0755'
            content: "#!/bin/sh\n# Boot helper for stage A1 (no student step). AUTO-RTR3 cannot carry its own API certificate in day-0:\n# the key pair is generated at boot and the first HTTPS start creates a default certificate (no SAN).\n# This loop (1) waits for the router, (2) creates trustpoint API-TP and replaces the default certificate with its certificate\n# (PKI cannot be created in day-0: the platform deletes a day-0 trustpoint at boot, no authoritative clock)\n# API-TP (CN and SAN rtr3.auto.veridian.example) over SSH, (3) stores what the router presents as the trust file.\nT=/home/cisco/trust; mkdir -p $T\nprintf '#!/bin/sh\\necho Cisco123!\\n' > $T/.ap; chmod 700 $T/.ap\nhave() { echo | openssl s_client -connect 10.90.50.11:443 -servername rtr3.auto.veridian.example 2>/dev/null | openssl x509 -out $T/rtr3.pem.new 2>/dev/null \\\n  && openssl x509 -in $T/rtr3.pem.new -noout -ext subjectAltName 2>/dev/null | grep -q rtr3.auto.veridian.example; }\nsshr() { SSH_ASKPASS=$T/.ap SSH_ASKPASS_REQUIRE=force setsid -w ssh -tt -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password admin@10.90.50.11; }\nfor i in $(seq 1 360); do\n  if have; then mv $T/rtr3.pem.new $T/rtr3.pem; chown cisco:cisco $T/rtr3.pem; rm -f $T/.ap; exit 0; fi\n  if nc -z -w 3 10.90.50.11 22; then\n    tp=$( (sleep 5; echo 'terminal length 0'; sleep 1; echo 'show running-config | include ^crypto pki trustpoint TP-self-signed'; sleep 3; echo exit) | sshr | tr -d '\\r' | grep -o 'TP-self-signed-[0-9]*' | head -1)\n    (sleep 5; echo 'configure terminal'; sleep 2; echo 'crypto pki trustpoint API-TP'; echo ' enrollment selfsigned'; echo ' subject-name CN=rtr3.auto.veridian.example'; echo ' subject-alt-name rtr3.auto.veridian.example'; echo ' revocation-check none'; echo ' rsakeypair API-KEY 2048'; echo ' exit'; sleep 2; echo 'ip http secure-trustpoint API-TP'; sleep 5; if [ -n \"$tp\" ]; then echo \"no crypto pki trustpoint $tp\"; sleep 3; echo yes; sleep 3; fi; echo end; sleep 2; echo 'crypto pki enroll API-TP'; sleep 20; echo exit) | sshr >/dev/null 2>&1\n  fi\n  sleep 20\ndone\n"
          - path: /home/cisco/auto/audit.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/auto/catc_inventory.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/auto/descriptions.csv
            permissions: '0644'
            encoding: b64
            content: aW50ZXJmYWNlLGRlc2NyaXB0aW9uCkxvb3BiYWNrMCxSb3V0ZXIgSUQKTG9vcGJhY2sxMDEsVGVzdCBsb29wYmFjawpHaWdhYml0RXRoZXJuZXQyLExpbmsgdG8gQVVUTy1SVFIxIGUwLzIK
          - path: /home/cisco/auto/fixtures/catc-network-device.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/auto/fixtures/catc-task.json
            permissions: '0644'
            encoding: b64
            content: 
          - path: /home/cisco/auto/nc_get.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/auto/rc_get.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/auto/set_desc.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/auto/show_cmds.py
            permissions: '0755'
            encoding: b64
            content: 
          - path: /home/cisco/ansible/ansible.cfg
            permissions: '0644'
            content: '[defaults]

              inventory = inventory.yml

              host_key_checking = False

              retry_files_enabled = False

              interpreter_python = auto_silent

              '
          - path: /home/cisco/ansible/group_vars/all.yml
            permissions: '0644'
            content: "std_lines:\n  - snmp-server location Veridian AUTO pod\n  - snmp-server contact noc@veridian.example\n"
          - path: /home/cisco/ansible/group_vars/netconf_hosts.yml
            permissions: '0644'
            content: 'ansible_connection: ansible.netcommon.netconf

              ansible_network_os: cisco.ios.ios

              ansible_port: 830

              ansible_user: apiuser

              ansible_password: Api#Pass2026

              '
          - path: /home/cisco/ansible/group_vars/routers.yml
            permissions: '0644'
            content: 'ansible_connection: ansible.netcommon.network_cli

              ansible_network_os: cisco.ios.ios

              ansible_user: admin

              ansible_password: Cisco123!

              '
          - path: /home/cisco/ansible/inventory.yml
            permissions: '0644'
            content: "all:\n  children:\n    routers:\n      hosts:\n        AUTO-RTR1:\n          ansible_host: 10.90.50.1\n        AUTO-RTR3:\n          ansible_host: 10.90.50.11\n    netconf_hosts:\n      hosts:\n        RTR3-NC:\n          ansible_host: 10.90.50.11\n"
          - path: /home/cisco/ansible/std.yml
            permissions: '0644'
            content: "- name: Apply the pod standard over SSH\n  hosts: routers\n  gather_facts: false\n  tasks:\n    - name: Standard SNMP lines\n      cisco.ios.ios_config:\n        lines: \"{{ std_lines }}\"\n        diff_against: running\n"
          - path: /home/cisco/ansible/std_netconf.yml
            permissions: '0644'
            content: "- name: Set the SNMP location over NETCONF\n  hosts: netconf_hosts\n  gather_facts: false\n  tasks:\n    - name: snmp-server location through the native YANG model\n      ansible.netcommon.netconf_config:\n        content: |\n          <config xmlns=\"urn:ietf:params:xml:ns:netconf:base:1.0\">\n          <native xmlns=\"http://cisco.com/ns/yang/Cisco-IOS-XE-native\">\n            <snmp-server>\n              <location xmlns=\"http://cisco.com/ns/yang/Cisco-IOS-XE-snmp\">Veridian AUTO pod</location>\n            </snmp-server>\n          </native>\n          </config>\n      register: nc\n      retries: 6\n      delay: 10\n      until: nc is succeeded or 'lock-denied' not in (nc.msg | default(''))\n"
          runcmd:
          - - sh
            - -c
            - chown cisco:cisco /home/cisco; chown -R cisco:cisco /home/cisco/auto
          - - tar
            - xzf
            - /var/tmp/lab059.tgz
            - -C
            - /home/cisco
          - - chown
            - -R
            - cisco:cisco
            - /home/cisco/yang
            - /home/cisco/json
            - /home/cisco/trees
          - - mkdir
            - -p
            - /home/cisco/trust
          - - sh
            - -c
            - grep -q rtr3.auto.veridian.example /etc/hosts || echo '10.90.50.11 rtr3.auto.veridian.example' >> /etc/hosts
          - - sh
            - -c
            - chown -R cisco:cisco /home/cisco/trust; nohup /home/cisco/trust/fetch-rtr3-cert.sh >/dev/null 2>&1 &
          - - sh
            - -c
            - chown -R cisco:cisco /home/cisco/ansible
          - - sh
            - -c
            - nohup sh -c "until apt-get update -q && apt-get install -y -q python3.12-venv; do sleep 15; done; su - cisco -c 'python3 -m venv /home/cisco/venv && /home/cisco/venv/bin/pip install -q requests==2.31.0 ncclient==0.7.1 netmiko==4.8.0 ansible==14.4.0'" >/var/log/a3-venv.log 2>&1 &
      - name: network-config
        content: |-
          network:
            version: 2
            ethernets:
              ens2:
                dhcp4: false
                addresses: [10.90.50.31/24]
                routes:
                  - to: 10.90.0.0/16
