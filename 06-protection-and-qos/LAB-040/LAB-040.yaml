nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          ip domain name veridian.example
          service timestamps debug datetime msec
          service timestamps log datetime msec
          logging buffered 64000
          enable secret Cisco123!
          username admin privilege 15 password 0 Cisco123!
          crypto key generate rsa modulus 2048
          ip ssh version 2
          snmp-server group OPS v3 priv
          snmp-server user nms OPS v3 auth sha AuthPass123 priv aes 128 PrivPass123
          router ospf 1
           router-id 10.255.0.1
           passive-interface Ethernet0/1
           passive-interface Ethernet0/2
          interface Loopback0
           ip address 10.255.0.1 255.255.255.255
           ip ospf 1 area 0
          interface Ethernet0/0
           ip address 10.0.12.0 255.255.255.254
           ip ospf network point-to-point
           ip ospf hello-interval 1
           ip ospf dead-interval 4
           ip ospf 1 area 0
           no shutdown
          interface Ethernet0/1
           description admin LAN
           ip address 10.0.10.1 255.255.255.0
           ip ospf 1 area 0
           no shutdown
          interface Ethernet0/2
           description untrusted LAN
           ip address 10.0.20.1 255.255.255.0
           ip ospf 1 area 0
           no shutdown
          router bgp 65001
           bgp router-id 10.255.0.1
           neighbor 10.0.12.1 remote-as 65002
           address-family ipv4
            neighbor 10.0.12.1 activate
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: R1
    node_definition: iol-xe
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: -50
    y: 0
    interfaces:
      - id: i0
        label: Loopback0
        mac_address: null
        type: loopback
      - id: i1
        label: Ethernet0/0
        mac_address: null
        type: physical
        slot: 0
      - id: i2
        label: Ethernet0/1
        mac_address: null
        type: physical
        slot: 1
      - id: i3
