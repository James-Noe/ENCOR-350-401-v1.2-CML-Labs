nodes:
  - boot_disk_size: null
    configuration:
      - name: ios_config.txt
        content: |-
          hostname R1
          no ip domain lookup
          ip domain name veridian.example
          service timestamps debug datetime msec
          service timestamps log datetime msec
          logging buffered 64000
          enable secret Cisco123!
          username admin privilege 15 password 0 Cisco123!
          crypto key generate rsa modulus 2048
          ip ssh version 2
          policy-map WAN-SHAPE
           class class-default
            shape average 1000000
          interface Loopback0
           ip address 10.255.0.1 255.255.255.255
          interface Ethernet0/0
           ip address 10.0.12.0 255.255.255.254
           service-policy output WAN-SHAPE
           no shutdown
          interface Ethernet0/1
           ip address 10.0.1.1 255.255.255.0
           no shutdown
          ip route 10.0.2.0 255.255.255.0 10.0.12.1
          ip route 10.255.0.2 255.255.255.255 10.0.12.1
          line con 0
           privilege level 15
           exec-timeout 0 0
           logging synchronous
          line vty 0 4
           login local
           transport input ssh
          end
    cpu_limit: null
    cpus: null
    data_volume: null
    hide_links: false
    id: n0
    image_definition: null
    label: R1
    node_definition: iol-xe
    parameters: {}
    priority: null
    pyats:
      username: null
      password: null
      enable_password: null
    ram: null
    tags: []
    x: -150
    y: 0
    interfaces:
